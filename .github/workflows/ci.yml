name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # macos-15, not macos-14: swift-tools-version 6.0 needs Xcode 16, and
    # `.canJoinAllApplications` (PlumeOverlay) only exists in the macOS 15 SDK.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Script syntax
        run: for f in Scripts/*.sh; do bash -n "$f"; done

      - name: Update signing round trip
        # A throwaway key: proves update_sign.swift compiles and that what it
        # signs, it verifies. The real key never leaves the maintainer's Mac.
        run: |
          T="$(mktemp -d)"
          PUB="$(swift Scripts/update_sign.swift keygen "$T/k.pem")"
          head -c 100000 /dev/urandom > "$T/payload"
          SIG="$(swift Scripts/update_sign.swift sign "$T/k.pem" "$T/payload")"
          swift Scripts/update_sign.swift verify "$PUB" "$T/payload" "$SIG"
          printf x >> "$T/payload"
          ! swift Scripts/update_sign.swift verify "$PUB" "$T/payload" "$SIG"

      - name: Unit tests
        run: swift test

      - name: Release build
        run: bash Scripts/build_app.sh release

      - name: Package app
        run: ditto -c -k --keepParent build/Plume.app build/Plume.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Plume-${{ github.sha }}
          path: build/Plume.zip
          retention-days: 7
