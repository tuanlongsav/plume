name: CI

# Branch pushes run through their pull request, so each change runs once;
# release tags need no run of their own.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # macos-15, not macos-14: swift-tools-version 6.0 needs Xcode 16, and
    # `.canJoinAllApplications` (PlumeOverlay) only exists in the macOS 15 SDK.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Script syntax
        # /bin/bash is the 3.2 that ships with macOS, which the scripts target.
        run: for f in Scripts/*.sh; do /bin/bash -n "$f"; done

      - name: Update signing round trip
        # A throwaway key: proves update_sign.swift compiles and that what it
        # signs, it verifies. The real key never leaves the maintainer's Mac.
        run: |
          T="$(mktemp -d)"
          PUB="$(swift Scripts/update_sign.swift keygen "$T/k.pem")"
          head -c 100000 /dev/urandom > "$T/payload"
          SIG="$(swift Scripts/update_sign.swift sign "$T/k.pem" "$T/payload")"
          swift Scripts/update_sign.swift verify "$PUB" "$T/payload" "$SIG"
          printf x >> "$T/payload"
          ! swift Scripts/update_sign.swift verify "$PUB" "$T/payload" "$SIG"

      - name: Atomic bundle swap
        # What install.sh relies on: an existing app is exchanged, the old one
        # ends up at the staged path, and a first install is a plain rename.
        run: |
          T="$(mktemp -d)"
          mkdir -p "$T/new.app" "$T/cur.app"
          echo new > "$T/new.app/v"; echo old > "$T/cur.app/v"
          swift Scripts/swap_bundle.swift "$T/new.app" "$T/cur.app"
          [ "$(cat "$T/cur.app/v")" = new ] && [ "$(cat "$T/new.app/v")" = old ]
          mkdir -p "$T/fresh.app"; echo fresh > "$T/fresh.app/v"
          swift Scripts/swap_bundle.swift "$T/fresh.app" "$T/absent.app"
          [ "$(cat "$T/absent.app/v")" = fresh ] && [ ! -e "$T/fresh.app" ]

      - name: Unit tests
        run: swift test

      - name: Release build
        # A stamped version exercises the version rule; the build number must
        # be MAJOR*10000 + MINOR*100, the same rule AppVersionTests pins.
        # Universal, like a release. The plist's minimum macOS must be every
        # slice's minos (build_app.sh derives it), the recorded SDK the pinned
        # 14.0, and nothing may load from @rpath: no Swift library is embedded.
        run: |
          PLUME_VERSION=1.2 PLUME_UNIVERSAL=1 bash Scripts/build_app.sh release
          P=build/Plume.app/Contents
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' $P/Info.plist)" = 10200 ]
          MIN="$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' $P/Info.plist)"
          INFO="$(vtool -show-build $P/MacOS/Plume)"
          echo "$INFO"
          [ "$(awk '$1 == "minos" { print $2 }' <<<"$INFO" | sort -u)" = "$MIN" ]
          [ "$(awk '$1 == "sdk" { print $2 }' <<<"$INFO" | sort -u)" = 14.0 ]
          LIBS="$(otool -L $P/MacOS/Plume)"
          if grep -q '@rpath/' <<<"$LIBS"; then echo "loads from @rpath:"; echo "$LIBS"; exit 1; fi
